  <text x="60" y="161" fill="#d5e7ef" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="1.2">APPLIED DATA SCIENCE  ·  AI PRODUCTS  ·  ANALYTICS</text>
