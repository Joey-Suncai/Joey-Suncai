<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Caijunyi Sun profile banner</title>
  <desc id="desc">A dark blue banner with a warm orange accent, data-inspired lines, and the words Applied Data Science, AI Products, Analytics.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#183b56"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#f37b58"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#background)"/>
  <path d="M0 216 C170 184 270 250 438 202 S713 165 840 194 S1050 235 1200 160" fill="none" stroke="#43718a" stroke-width="2" opacity=".5"/>
  <path d="M0 244 C165 199 278 224 415 183 S700 145 834 166 S1058 201 1200 120" fill="none" stroke="#6da2b8" stroke-width="2" opacity=".45"/>
  <g opacity=".22" stroke="#b9d6e2" stroke-width="1.5">
    <path d="M846 91 L958 51 L1062 88 L1153 43" fill="none"/>
    <path d="M820 147 L935 132 L1027 157 L1143 113" fill="none"/>
